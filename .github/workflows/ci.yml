name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install matplotlib pytest ruff
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  distributed-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Parameter-server smoke test
        run: >-
          python train_ps.py --workers 2 --epochs 1 --train-size 64 --test-size 32
          --global-batch-size 32 --out logs/parameter-server.csv
      - name: Manual ring-allreduce smoke test
        run: >-
          python train_ringallreduce.py --workers 2 --epochs 1 --train-size 64 --test-size 32
          --global-batch-size 32 --out logs/ring.csv
      - name: DDP smoke test
        run: >-
          python train_ddp.py --workers 2 --epochs 1 --train-size 64 --test-size 32
          --global-batch-size 32 --out logs/ddp.csv
